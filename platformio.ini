; SuperOS-101, open SH-101 firmware for an AT90USB1286 replacement CPU board.
; Clean-sheet firmware (the SH-101 CPU is an MCS-48 80C49, NOT the uPD650 of the
; 303/606, see docs/HARDWARE.md). Build: PlatformIO. `pio run` -> app .hex.
;
; Flashing: ISP via the Tag-Connect TC2030 pads with an Atmel-ICE (avrdude
; -c atmelice_isp). Fuses once per chip with `pio run -e fuses` (lfuse 0xDF,
; NOT the 303/606 0x9F, see [env:fuses]), then the app hex with a chip erase,
; then the bootloader hex with -D. Field updates go over DIN MIDI SysEx through
; the bootloader (tools/makesyx.py + tools/sendsyx). Full steps in README.md.

[platformio]
src_dir = src
default_envs = app

[env]
custom_project_version = 0.2
; Embed the 80C49 mask ROM (SH101-reference dump) for the combined build's
; emulator mode; emits a stub when the dump is absent (emulator disabled).
; buildrev defines SUPEROS_BUILD_REV, the git sha this image was built from,
; which sysex.h publishes on 0x34 -> 0x35. Every env gets it: an image that
; cannot say what it is is the problem it exists to fix, and the emulator envs
; are the case where that is least obvious from the outside.
extra_scripts =
  pre:tools/mkrom.py
  pre:tools/buildrev.py

; ---- main firmware ----
[env:app]
framework = arduino
platform = teensy
board = teensy2pp
; 16 MHz crystal, core clock prescaled to 4 MHz (the Teensy core sets CLKPR
; from F_CPU before setup(); the USB PLL runs from the crystal and is
; unaffected). This is the SH-101 rail current budget: the synth's +5 V
; regulator (VR-1 "D/A WIDTH", also the pitch DAC's reference) is at its limit
; with this board. Measured on the first unit 2026-08-15 with the SysEx 0x3E
; bench window and 0x3B probe: 16 MHz + USB engine 4.49-4.65 V (out of
; regulation, pitch ~7 semitones off, moving with load); USB engine off
; 4.98 V; 8 MHz + USB engine 4.96 V in the CPU-bound emulator (still at the
; regulator's knee: ~5 cents of load-dependent wobble), 4.98 V in SuperOS
; (idle-sleep waits, hw.h); 4 MHz + USB engine 4.98 V in BOTH firmwares,
; pitch identical to engine-off. 4 MHz costs the emulator speed (interpreter
; ~4x slower than the real 6 MHz 80C49 after the 2026-08-15 speedups, see
; README "Tuning"; key/arp latency and clock jitter, not pitch) and
; nothing measurable in SuperOS (pass ~0.9 ms vs the original's 1.5-3.5 ms).
; The bootloader env stays at 16 MHz: it only runs during an update, when the
; rail sag cannot matter, and its USB timing is verified there (reset clears
; CLKPR; the jump entry restores it). Keep f_cpu in sync with the real core
; clock: millis(), delayMicroseconds() and the MIDI baud derive from it.
board_build.f_cpu = 4000000L
build_src_filter = +<*> -<bootloader/> -<diag/>
build_flags =
  -DSUPEROS_VERSION=\"0.2\"
  ; USB-MIDI over the USB-C port (same scheme as SuperOS-303/606). On the
  ; AT90USB (Teensy 2.0) core the USB type is selected by the USB_MIDI macro
  ; (defining any built-in USB flag suppresses the platform's default
  ; USB_SERIAL). SUPEROS_USB_MIDI gates the firmware side: the second parser
  ; port in midi.h, the VBUS/SOF gate in usb_gate.h, detach before resets.
  -DUSB_MIDI
  -DSUPEROS_USB_MIDI
  ; USB identity: product string and a stable serial number (the core is
  ; patched by tools/patch_usb_core.py to serve them; without a serial, macOS
  ; CoreMIDI matches by port and a 101 can show up under the name of whatever
  ; SuperOS unit last lived on that port). VID/PID stay the core's 16C0:0485,
  ; which is what the bootloader (src/bootloader/usb_boot.c) uses too.
  -DSTR_PRODUCT='L"SuperOS-101"'
  -DSTR_SERIAL_NUMBER='L"SOS101-0001"'
  -Wl,--section-start=.text=0x0000
; mkrom and buildrev are inherited from [env]; re-list them here because
; extra_scripts does NOT merge, so overriding it in this env would silently
; drop them. patch_usb_core makes the identity flags above take effect;
; makesyx emits app-update.syx for the SysEx bootloader.
extra_scripts =
  pre:tools/mkrom.py
  pre:tools/buildrev.py
  pre:tools/patch_usb_core.py
  post:tools/makesyx.py

; same as app, but with USB serial + DEBUG for bench testing over USB
; (USB serial instead of USB-MIDI: the AVR core has no combined type)
[env:app-debug]
extends = env:app
build_flags =
  -DSUPEROS_VERSION=\"0.2\"
  -DUSB_SERIAL
  -DDEBUG=1
  -Wl,--section-start=.text=0x0000

; same as app, but with USB fully disabled: the Teensy core compiles no USB
; code at all (USB_DISABLED suppresses the platform's default -DUSB_SERIAL),
; and boot.cpp provides the usb_init() stub the core still calls. DIN MIDI
; (UART1) is the only external interface. DIN-only fallback / bring-up build;
; the USB engine is never enabled.
[env:app-nousb]
extends = env:app
build_flags =
  -DSUPEROS_VERSION=\"0.2\"
  -DUSB_DISABLED
  -Wl,--section-start=.text=0x0000

; DAC-path diagnostic (src/diag/diag.cpp): staircase on CV out, range on the
; VCO S/H, 1 ms acquire; boot BUS self-test streamed over DIN MIDI OUT
; (decode with tools/recvsyx); HOLD toggles probe mode: 1 Hz square on
; DB6/DB7 plus a jumper-wire loopback detector that opens the gate when
; the square is seen on a P1 row (see the diag.cpp header). Bring-up only.
[env:diag]
extends = env:app
build_src_filter = +<diag/>
build_flags =
  -DUSB_DISABLED
  -Wl,--section-start=.text=0x0000

; ---- fuses (only when flashing a blank chip via ISP) ----
; hfuse mirrors SuperOS-303/606 (JTAG off, BOOTRST + 4 KB boot section).
; efuse 0xF9 = BOD at 3.5 V (BODLEVEL 001), NOT the 303/606 0xF8 (4.3 V): on
; the SH-101 the AVR's VCC comes from the synth's own +5 V rail, which sits
; close enough to 4.3 V that every SPM flash write (pattern-arena flush,
; bootloader page write) and the USB PLL start dipped below it and reset the
; chip (BORF, measured 2026-08-15 with SysEx 0x3B: 0x4A bounced straight back
; to the app, updates wrote nothing, pattern saves were lost). 3.5 V still
; guards the flash store against real power loss.
; lfuse does NOT: the 303/606 value 0x9F has CKOUT programmed, which forces the
; 16 MHz system clock out on CLKO = PC7 regardless of PORTC/DDRC. On this board
; PC7 is DB7 (4052 route-select B), so 0x9F leaves DB7 driven by the clock:
; pitch/range routes unreachable, only random/none reachable (2026-08-15 fault).
; 0xDF = same crystal/SUT bits, CKOUT unprogrammed.
; Bench ISP rig is an Atmel-ICE (first chip flashed 2026-08-14). Note: that
; chip arrived with lock bits programmed; a chip erase (avrdude -e) is needed
; before the first fuse write on a locked part.
[env:fuses]
platform = atmelavr
board_build.mcu = at90usb1286
upload_protocol = atmelice_isp
upload_command =
    avrdude -c atmelice_isp -p at90usb1286 -B 32
    -U lfuse:w:0xDF:m
    -U hfuse:w:0xDA:m
    -U efuse:w:0xF9:m

; ---- MIDI SysEx bootloader (boot section, 4 KB @ 0x1F000) ----
; Ported from SuperOS-303 (same AT90USB1286, same BOOTRST/BOOTSZ=01 fuses,
; same F0 7D ... F7 update protocol over DIN MIDI and USB-MIDI). The app
; jumps here on SysEx F0 7D 4A F7 after parking BOOT_MAGIC in GPIOR0.
[env:bootloader]
build_src_filter = +<bootloader/*>
; flash_service.c (SPM page writer for the flash-arena pattern store) is part
; of this image: trampoline pinned at 0x1FE00, body at 0x1FE40 (top of the
; 4 KB boot section, above the bootloader proper at 0x1F000).
platform = atmelavr
board_build.mcu = at90usb1286
board_build.f_cpu = 16000000L
upload_protocol = atmelice_isp
framework =
build_flags =
    -Os
    ; reset enters the boot section at its first byte, so the entry stub is
    ; pinned at 0x1F000 and everything else follows.
    -Wl,--section-start=.boot_entry=0x1F000
    -Wl,--section-start=.text=0x1F010
    -Wl,--section-start=.service_entry=0x1FE00
    -Wl,--section-start=.service_text=0x1FE40
    -Wl,--undefined=flash_service_entry
    -Wl,--entry=boot_entry
    -nostartfiles
    -nostdlib
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
upload_flags = -p at90usb1286
; -D: no chip erase, so flashing the bootloader never wipes the app section
upload_command =
    avrdude -c atmelice_isp -p at90usb1286 -B 4 -D
    -U flash:w:$SOURCE:i

; bootloader without USB: DIN MIDI (UART1) is the only update path.
; NO_USB stubs out the usb_boot_* calls in bootload.c; usb_boot.c is
; excluded from the build entirely.
[env:bootloader-nousb]
extends = env:bootloader
build_src_filter = +<bootloader/*> -<bootloader/usb_boot.c>
build_flags =
    -Os
    -DNO_USB
    -Wl,--section-start=.boot_entry=0x1F000
    -Wl,--section-start=.text=0x1F010
    -Wl,--section-start=.service_entry=0x1FE00
    -Wl,--section-start=.service_text=0x1FE40
    -Wl,--undefined=flash_service_entry
    -Wl,--entry=boot_entry
    -nostartfiles
    -nostdlib
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
